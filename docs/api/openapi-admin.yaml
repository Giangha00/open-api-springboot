---
openapi: "3.1.0"
info:
  title: "TechShop Order & Catalog API"
  description: "Hệ thống REST API quản lý Sản phẩm và Dịch vụ Đặt hàng cho TechShop\
    \ theo chuẩn OpenAPI 3.1 & Spring Boot 4."
  contact:
    name: "TechShop Backend Team"
    email: "support@techshop.vn"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0"
  version: "1.0.0"
externalDocs:
  description: "Tài liệu hướng dẫn tích hợp chi tiết"
  url: "https://example.com/docs/techshop-api"
servers:
- url: "http://localhost:8080"
  description: "Môi trường hiện tại"
- url: "https://api.techshop.vn"
  description: "Production Gateway"
tags:
- name: "Orders (Public)"
  description: "API quản lý Đơn hàng cho Khách hàng TechShop (v2)"
- name: "Admin"
  description: "API Quản trị dành cho Quản lý / ADMIN TechShop"
paths:
  /api/orders/{code}/transitions:
    post:
      tags:
      - "Orders (Public)"
      summary: "Chuyển trạng thái đơn hàng (Khách hàng)"
      description: "Khách hàng thực hiện các thao tác: CANCEL (chỉ khi đơn còn PENDING),\
        \ REQUEST_RETURN (chỉ khi đơn DELIVERED trong vòng 7 ngày). Bắt buộc truyề\
        n header If-Match."
      operationId: "transitionOrder"
      parameters:
      - name: "code"
        in: "path"
        description: "Mã đơn hàng"
        required: true
        schema:
          type: "string"
        example: "ORD-2026-000123"
      - name: "If-Match"
        in: "header"
        description: "Phiên bản hiện tại của đơn hàng (bắt buộc)"
        required: true
        schema:
          type: "string"
        example: "0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTransitionRequest"
        required: true
      responses:
        "200":
          description: "Chuyển trạng thái thành công"
          headers:
            ETag:
              description: "Phiên bản mới của đơn hàng"
              style: "simple"
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTransitionResponse"
        "409":
          description: "Chuyển trạng thái không hợp lệ (ORDER_INVALID_TRANSITION)"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "412":
          description: "Phiên bản If-Match không khớp (PRECONDITION_FAILED)"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - bearerAuth: []
  /api/orders/{code}/invoice:
    get:
      tags:
      - "Orders (Public)"
      summary: "Tải hóa đơn PDF của đơn hàng"
      description: "Khách hàng tải hóa đơn điện tử PDF của đơn hàng (nếu quản trị\
        \ viên đã xuất hóa đơn)."
      operationId: "getInvoice"
      parameters:
      - name: "code"
        in: "path"
        description: "Mã đơn hàng"
        required: true
        schema:
          type: "string"
        example: "ORD-2026-000123"
      responses:
        "200":
          description: "Trả về file hóa đơn PDF"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/pdf: {}
        "404":
          description: "Chưa có hóa đơn hoặc đơn hàng không tồn tại"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - bearerAuth: []
    post:
      tags:
      - "Admin"
      summary: "Tải lên hóa đơn PDF cho đơn hàng"
      description: "ADMIN tải lên hóa đơn điện tử cho đơn hàng. Định dạng bắt buộ\
        c PDF, kích thước tối đa 5 MB."
      operationId: "uploadInvoice"
      parameters:
      - name: "code"
        in: "path"
        description: "Mã đơn hàng"
        required: true
        schema:
          type: "string"
        example: "ORD-2026-000123"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "File hóa đơn điện tử PDF (tối đa 5 MB)"
              required:
              - "file"
      responses:
        "200":
          description: "Đã tải lên hóa đơn thành công"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties:
                  type: "string"
        "400":
          description: "File không hợp lệ hoặc không phải PDF"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - bearerAuth: []
  /api/admin/orders/{code}/transitions:
    post:
      tags:
      - "Admin"
      summary: "Quản trị viên chuyển trạng thái đơn hàng"
      description: "ADMIN có quyền thực hiện mọi hành động (CONFIRM, SHIP, CANCEL\
        \ với reason khi CONFIRMED, ACCEPT_RETURN). Bắt buộc If-Match."
      operationId: "adminTransitionOrder"
      parameters:
      - name: "code"
        in: "path"
        description: "Mã đơn hàng"
        required: true
        schema:
          type: "string"
        example: "ORD-2026-000123"
      - name: "If-Match"
        in: "header"
        description: "Phiên bản hiện tại của đơn hàng (bắt buộc)"
        required: true
        schema:
          type: "string"
        example: "0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTransitionRequest"
        required: true
      responses:
        "200":
          description: "Chuyển trạng thái đơn hàng thành công"
          headers:
            ETag:
              description: "Phiên bản mới của đơn hàng"
              style: "simple"
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTransitionResponse"
        "409":
          description: "Chuyển trạng thái không hợp lệ (ORDER_INVALID_TRANSITION)"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
        "412":
          description: "If-Match lệch version (PRECONDITION_FAILED)"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
      security:
      - bearerAuth: []
  /api/admin/reports/daily-revenue:
    get:
      tags:
      - "Admin"
      summary: "Báo cáo doanh thu theo ngày"
      description: "Thống kê tổng số đơn hàng hợp lệ và tổng doanh thu theo từng ngà\
        y trong khoảng thời gian chỉ định."
      operationId: "getDailyRevenueReport"
      parameters:
      - name: "from"
        in: "query"
        description: "Ngày bắt đầu (YYYY-MM-DD)"
        required: false
        schema:
          type: "string"
          format: "date"
        example: "2026-10-01"
      - name: "to"
        in: "query"
        description: "Ngày kết thúc (YYYY-MM-DD)"
        required: false
        schema:
          type: "string"
          format: "date"
        example: "2026-10-31"
      responses:
        "200":
          description: "Dữ liệu báo cáo doanh thu theo ngày"
          headers:
            X-Request-Id:
              description: "Mã theo dõi duy nhất cho mỗi yêu cầu HTTP (UUID)"
              schema:
                type: "string"
                example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DailyRevenueReportResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    OrderTransitionRequest:
      type: "object"
      description: "Yêu cầu thực hiện chuyển trạng thái đơn hàng"
      properties:
        action:
          type: "string"
          description: "Hành động chuyển trạng thái được phép:\n- CONFIRM: ADMIN (PENDING\
            \ -> CONFIRMED)\n- SHIP: ADMIN / PARTNER (CONFIRMED -> SHIPPING)\n- DELIVER:\
            \ PARTNER (SHIPPING -> DELIVERED)\n- CANCEL: CUSTOMER (khi PENDING) |\
            \ ADMIN (khi PENDING hoặc CONFIRMED kèm reason)\n- FAIL_DELIVERY: PARTNER\
            \ (SHIPPING -> CONFIRMED)\n- REQUEST_RETURN: CUSTOMER (DELIVERED -> RETURN_REQUESTED,\
            \ trong vòng 7 ngày)\n- ACCEPT_RETURN: ADMIN (RETURN_REQUESTED -> RETURNED)"
          enum:
          - "CONFIRM"
          - "SHIP"
          - "DELIVER"
          - "CANCEL"
          - "FAIL_DELIVERY"
          - "REQUEST_RETURN"
          - "ACCEPT_RETURN"
          example: "CANCEL"
        reason:
          type: "string"
          description: "Lý do chuyển trạng thái (bắt buộc khi ADMIN hủy đơn ở trạ\
            ng thái CONFIRMED hoặc khi trả hàng)"
          example: "Khách hàng đổi ý muốn đổi sang mẫu mã khác"
      required:
      - "action"
    ApiProblem:
      type: "object"
      description: "Mô hình lỗi chuẩn RFC 9457 mở rộng với mã lỗi nghiệp vụ và chi\
        \ tiết trường"
      properties:
        type:
          type: "string"
          format: "uri"
          description: "URI định danh kiểu lỗi"
          example: "https://api.example.com/errors/invalid-transition"
        title:
          type: "string"
          description: "Tiêu đề ngắn gọn về lỗi"
          example: "Invalid order state transition"
        status:
          type: "integer"
          format: "int32"
          description: "Mã trạng thái HTTP"
          example: 409
        detail:
          type: "string"
          description: "Mô tả chi tiết nguyên nhân lỗi"
          example: "Cannot transition order from DELIVERED to CANCELLED"
        instance:
          type: "string"
          description: "URI tài nguyên xảy ra lỗi"
          example: "/api/orders/ORD-2026-000123/transitions"
        code:
          type: "string"
          description: "Mã định danh lỗi nghiệp vụ duy nhất"
          example: "ORDER_INVALID_TRANSITION"
        timestamp:
          type: "string"
          format: "date-time"
          description: "Thời điểm xảy ra lỗi"
          example: "2026-10-23T12:00:00Z"
        errors:
          type: "array"
          description: "Danh sách chi tiết lỗi validate theo trường (nếu có)"
          items:
            $ref: "#/components/schemas/FieldErrorItem"
    FieldErrorItem:
      type: "object"
      description: "Chi tiết lỗi của từng trường dữ liệu"
      properties:
        field:
          type: "string"
          description: "Tên trường vi phạm"
          example: "quantity"
        message:
          type: "string"
          description: "Nội dung thông báo lỗi"
          example: "must be less than or equal to 20"
    OrderTransitionResponse:
      type: "object"
      description: "Kết quả chuyển trạng thái đơn hàng thành công"
      properties:
        code:
          type: "string"
          description: "Mã đơn hàng"
          example: "ORD-2026-000123"
        fromStatus:
          type: "string"
          description: "Trạng thái trước khi chuyển"
          enum:
          - "PENDING"
          - "CONFIRMED"
          - "SHIPPING"
          - "DELIVERED"
          - "CANCELLED"
          - "RETURN_REQUESTED"
          - "RETURNED"
          example: "PENDING"
        toStatus:
          type: "string"
          description: "Trạng thái sau khi chuyển thành công"
          enum:
          - "PENDING"
          - "CONFIRMED"
          - "SHIPPING"
          - "DELIVERED"
          - "CANCELLED"
          - "RETURN_REQUESTED"
          - "RETURNED"
          example: "CONFIRMED"
        action:
          type: "string"
          description: "Hành động đã thực hiện"
          enum:
          - "CONFIRM"
          - "SHIP"
          - "DELIVER"
          - "CANCEL"
          - "FAIL_DELIVERY"
          - "REQUEST_RETURN"
          - "ACCEPT_RETURN"
          example: "CONFIRM"
        version:
          type: "integer"
          format: "int64"
          description: "Phiên bản mới của đơn hàng (ETag)"
          example: 1
        message:
          type: "string"
          description: "Thông báo kết quả"
          example: "Đơn hàng ORD-2026-000123 đã được chuyển sang trạng thái CONFIRMED\
            \ thành công."
    DailyRevenueReportResponse:
      type: "object"
      description: "Báo cáo doanh thu theo ngày"
      properties:
        date:
          type: "string"
          format: "date"
          description: "Ngày thống kê (YYYY-MM-DD)"
          example: "2026-10-23"
        totalOrders:
          type: "integer"
          format: "int64"
          description: "Tổng số đơn hàng hoàn thành / hợp lệ trong ngày"
          example: 15
        totalRevenue:
          type: "number"
          description: "Tổng doanh thu ghi nhận trong ngày"
          example: 4.58E7
        currency:
          type: "string"
          description: "Đơn vị tiền tệ"
          example: "VND"
  securitySchemes:
    bearerAuth:
      type: "http"
      description: "Nhập Bearer Token (Ví dụ: dev-admin-token hoặc dev-customer-token)"
      name: "bearerAuth"
      scheme: "bearer"
      bearerFormat: "JWT"
    partnerKey:
      type: "apiKey"
      description: "API Key dành cho đối tác vận chuyển (Mặc định dev: partner-secret-key-2026)"
      name: "X-Partner-Key"
      in: "header"
